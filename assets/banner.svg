<style>
  .title { font: 800 112px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, 'DejaVu Sans', Arial, sans-serif; letter-spacing: -3px; }
  .kicker { font: 600 19px 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; fill: #30d158; letter-spacing: .5px; }
  .sub { font: 500 27px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, 'DejaVu Sans', Arial, sans-serif; fill: #e6edf3; }
  .muted { fill: #8b949e; }
  .chip { font: 600 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, 'DejaVu Sans', Arial, sans-serif; }
  .tw { fill: #fff; opacity: .15; animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .8; } }
  .edge { stroke: #ffffff; stroke-opacity: .07; stroke-width: 1.2; }
  .pulse { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 12 100;
           stroke-dashoffset: 112; opacity: 0; animation: pulse 3.6s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes pulse { 0% { stroke-dashoffset: 112; opacity: 0; } 10% { opacity: 1; }
                     80% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .node { fill: #0d1117; stroke: #2997ff; stroke-width: 2.5; animation: node 3s ease-in-out infinite; }
  @keyframes node { 50% { stroke: #64d2ff; fill: #10233d; } }
  .halo { fill: #2997ff; opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 3s ease-out infinite; }
  @keyframes halo { 0% { opacity: .45; transform: scale(.5); } 70%,100% { opacity: 0; transform: scale(2); } }
  .reveal { animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } }
  .wipe { animation: wipe 1.3s cubic-bezier(.7,0,.2,1) .25s backwards; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .caret { fill: #30d158; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scan { fill: url(#shine); opacity: .05; animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
  .spin { transform-origin: 945px 190px; animation: spin 40s linear infinite; }
  .spin2 { transform-origin: 945px 190px; animation: spin 26s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
